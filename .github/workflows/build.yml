name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Firebase ayari
        run: |
          test -f google-services.json || { echo "google-services.json dosyasi depoda yok"; exit 1; }
          cp google-services.json android/app/google-services.json
      - run: bash native/apply.sh
      - run: npx cap sync android
      - name: Sabit imza (Google girisi icin)
        run: |
          mkdir -p ~/.android
          base64 -d debug.keystore.b64 > ~/.android/debug.keystore
      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Loca-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
